buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
    }
    dependencies {
        // FG 2.1.x 系列官方适配 1.8.9；2.1.6 为 Forge 官方重发版，
        // 原版 jar 走 launchermeta.mojang.com、MCP 数据/映射走 maven.minecraftforge.net（均存活）
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1.6'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

// 版本号：mod名 + mc版本 + mod版本（见 .MCMOD.runtime.txt）
version = "1.8.9-1.0.0"
group = "com.github.savemysaves"
archivesBaseName = "savemysaves"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    // 1.8.9 可用的最新 MCP snapshot 映射（maven.minecraftforge.net/de/oceanlabs/mcp）
    mappings = "snapshot_20160301"
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// 编译兼容性（JDK8 编译）
compileJava {
    sourceCompatibility = "1.8"
    targetCompatibility = "1.8"
}

// 确保使用UTF-8（javac 默认 GBK 读 UTF-8 源码会连锁报"找不到符号"）
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    // 本 Mod 仅使用 Forge 提供的 API，无需额外依赖
}
