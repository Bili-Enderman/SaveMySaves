buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'

// 版本号：mod名 + mc版本 + mod版本（见 .MCMOD.runtime.txt）
version = '1.0.0'
group = 'com.github.savemysaves'
archivesBaseName = 'savemysaves-1.16.5'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { savemysaves { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { savemysaves { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "savemysaves",
            "Specification-Vendor": "com.github.savemysaves",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "com.github.savemysaves",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// FG 5.1.77 的 reobfJar 对 official 名字节码零匹配（无实效），
// 发布版由 SpecialSource + _mdk/official_to_srg.tsrg 手工重映射（见 README）
jar.finalizedBy('reobfJar')
